name: Update Release

on:
  push:
    branches: [ main ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Sharp
        run: npm install sharp

      - name: Run Generator Script
        run: node generate_guide.js

      - name: Cleanup Build Artifacts
        run: rm -rf node_modules package-lock.json package.json generate_guide.js .gitignore

      - name: Create Archive
        uses: thedoctor0/zip-release@master
        with:
          filename: 'Santy112Pack.zip'
          exclusions: '*.git* .github/* README.md .vscode/ .vscode/*'

      - name: Update Release
        uses: pyTooling/Actions/releaser@r0
        with:
          tag: latest
          rm_targs: Santy112Pack.zip
          files: Santy112Pack.zip
          token: ${{ secrets.GITHUB_TOKEN }}